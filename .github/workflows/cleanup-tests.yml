name: Remove automated test orders (manual)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete test orders on keikoartist.com
        run: |
          r=$(curl -s -m 60 -X POST -H "Origin: https://keikoartist.com" "https://keikoartist.com/order-api.php?a=cleanup_tests")
          echo "::notice::$r"
