name: Diagnose admin API (manual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe admin endpoints (no login, saves nothing)
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          for ep in order-api.php chat-api.php; do
            for body in '{"action":"storage"}' '{"action":"list","status":"active"}' '{"action":"me"}'; do
              c=$(curl -s -o r.txt -D h.txt -w "%{http_code} %{content_type}" -m 40 -A "$UA" -X POST -H 'Content-Type: application/json' -H 'Origin: https://keikoartist.com' -H 'Referer: https://keikoartist.com/admin/' --data "$body" "https://keikoartist.com/$ep")
              echo "::notice::$ep $body -> $c | $(head -c 300 r.txt | tr '\n' ' ')"
            done
          done
          c=$(curl -s -o r.txt -w "%{http_code} %{content_type}" -m 40 -A "$UA" "https://keikoartist.com/admin/"); echo "::notice::GET /admin/ -> $c | $(grep -o "OAPI='[^']*'" r.txt)"
          echo "::notice::PING $(curl -s -m 30 -X POST -H 'Origin: https://keikoartist.com' 'https://keikoartist.com/order-api.php?a=ping&net=1')"
