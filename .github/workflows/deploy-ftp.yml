name: Deploy to Rumahweb (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip (FTP secrets not set yet)
        if: env.FTP_SERVER == ''
        run: echo "FTP_SERVER secret belum diisi — deploy dilewati."

      - name: Upload changed files via FTP
        id: ftp1
        continue-on-error: true
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || 'public_html/' }}
        run: python3 tools/ftp_deploy.py

      - name: Wait before retry
        if: env.FTP_SERVER != '' && steps.ftp1.outcome == 'failure'
        run: sleep 45

      - name: Upload changed files via FTP (retry)
        if: env.FTP_SERVER != '' && steps.ftp1.outcome == 'failure'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || 'public_html/' }}
        run: python3 tools/ftp_deploy.py
