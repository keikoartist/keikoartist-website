name: Debug iPhone Safari errors (manual)
# Opens keikoartist.com in WebKit with iPhone emulation and prints every JavaScript error with its location.
on:
  workflow_dispatch:
permissions: {}
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.48.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - name: Load the homepage as iPhone Safari and Mac Safari
        run: |
          cat > d.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def go(p, label, dev):
              br = await p.webkit.launch()
              ctx = await br.new_context(**(p.devices[dev] if dev else {}))
              pg = await ctx.new_page()
              pg.on('pageerror', lambda e: print(f'::notice::[{label}] pageerror: {e.message} | stack: {(e.stack or "")[:400]}'))
              pg.on('console', lambda m: m.type == 'error' and print(f'::notice::[{label}] console: {m.text[:300]} @ {m.location}'))
              await pg.goto('https://keikoartist.com/?dryrun=1', wait_until='load')
              await pg.wait_for_timeout(3000)
              try:
                  await pg.locator('#svcAll').scroll_into_view_if_needed(timeout=10000); await pg.click('#svcAll', timeout=10000)
                  print(f'::notice::[{label}] svcAll clicked')
              except Exception as e: print(f'::notice::[{label}] svcAll FAIL {str(e)[:200]}')
              await pg.wait_for_timeout(1500)
              info = await pg.evaluate('''() => { const h=[...document.querySelectorAll('.card h3')].find(x=>x.textContent.trim()==='Custom Inquiry'); if(!h) return 'no custom card';
                const c=h.closest('.card'), b=c.querySelector('[data-order]'), r=c.getBoundingClientRect(), cs=getComputedStyle(c);
                return 'card display '+cs.display+' vis '+cs.visibility+' h '+Math.round(r.height)+' btn '+(b?getComputedStyle(b).display:'none')+' | svcAll text '+((document.querySelector('#svcAll')||{}).textContent||'').trim()+' | grid class '+(c.parentElement.className); }''')
              print(f'::notice::[{label}] {info}')
              ua = await pg.evaluate('navigator.userAgent')
              ok = await pg.evaluate('typeof openOrder')
              print(f'::notice::[{label}] UA {ua} | openOrder: {ok}')
              await br.close()
          async def main():
              async with async_playwright() as p:
                  await go(p, 'iPhone', 'iPhone 13')
                  await go(p, 'Mac', None)
          asyncio.run(main())
          PY
          python3 -c 'import playwright' 2>/dev/null || pip install -q --break-system-packages playwright==1.48.0 || pip install -q playwright==1.48.0
          python3 d.py
      - uses: actions/checkout@v5
      - name: Run the daily check script for iPhone Safari only (never fails the run)
        run: |
          python3 - <<'PY'
          import re
          y=open('.github/workflows/live-browser-test.yml').read()
          body=y.split("cat > t.py <<'PY'\n",1)[1].split("\n          PY\n",1)[0]
          body='\n'.join(l[10:] if l.startswith('          ') else l for l in body.split('\n'))
          body=re.sub(r"for a in \[.*?\]:", "for a in [('iPhone Safari','webkit','iPhone 13')]:", body, count=1, flags=re.S)
          open('t.py','w').write(body)
          PY
          python3 t.py || echo "::notice::iPhone check reported a problem (see above)"
