name: Test FormSubmit (manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check FormSubmit homepage
        run: |
          for u in https://formsubmit.co/ https://formsubmit.co/ajax/keikoarts22@gmail.com; do
            c=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$u"); echo "::notice::GET $u -> $c"
          done
      - name: Submit a test custom order like the website does
        if: false
        run: |
          printf 'PNGTEST' > ref.png
          code=$(curl -s -o body.html -D headers.txt -w "%{http_code}" \
            -H "Origin: https://keikoartist.com" -H "Referer: https://keikoartist.com/" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
            -F "_subject=[TEST by Claude - ignore] New custom order — \$113.00 incl. tax [INV-TEST-0001]" \
            -F "_next=https://keikoartist.com/?sent=1" -F "_captcha=false" -F "_template=table" -F "_honey=" \
            -F "Request ID=INV-TEST-0001" -F "Service=Custom Inquiry" -F "Package=Custom commission" \
            -F "Estimated total (USD)=\$113.00 (TEST)" -F "Name=TEST by Claude - ignore" -F "Discord=test" \
            -F "Details=Test submission from Claude to debug the custom order form. Please ignore." \
            -F "Usage=Personal" -F "Payment plan=Full payment" \
            -F "attachment1=@ref.png;type=image/png" \
            https://formsubmit.co/keikoarts22@gmail.com)
          echo "::notice::HTTP $code"
          echo "::notice::Location: $(grep -i '^location:' headers.txt | tr -d '\r' | cut -c1-200)"
          echo "::notice::Title: $(grep -o '<title>[^<]*' body.html | head -1 | cut -c8-200)"
          echo "::notice::Body: $(sed 's/<[^>]*>/ /g' body.html | tr -s ' \n' ' ' | cut -c1-400)"
