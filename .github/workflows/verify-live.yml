name: Verify live site

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check keikoartist.com
        run: |
          for u in "https://keikoartist.com/" "https://keikoartist.com/index.html" "https://www.keikoartist.com/" "http://keikoartist.com/"; do
            h=$(curl -s -I -m 20 "$u" | tr -d '\r' | grep -iE '^(HTTP|cache-control|expires|last-modified|etag|x-litespeed|x-cache|location|server|age|x-proxy)' | tr '\n' ' ')
            echo "::notice::$u => $h"
          done
          html=$(curl -sL -H "Cache-Control: no-cache" "https://keikoartist.com/?v=$(date +%s)")
          for t in "order-api.php?a=submit" "Get Invoice" "theresa.oktavia10@gmail.com"; do
            if grep -q "$t" <<<"$html"; then echo "::notice::FOUND $t"; else echo "::warning::MISSING $t"; fi
          done
